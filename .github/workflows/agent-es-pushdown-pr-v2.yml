name: Elasticsearch pushdown PR follow-up v2

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'fix/es-pushdown-fixes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es-pushdown-fixes
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply follow-up patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {count}: {pattern[:100]}")
              p.write_text(text)

          client = "plugin/trino-elasticsearch/src/main/java/io/trino/plugin/elasticsearch/client/ElasticsearchClient.java"
          p = Path(client)
          text = p.read_text()
          old = '''                    if (type.equals("text")) {
                        Optional<String> keyword = keywordSubfield(value, useBoundedKeyword);
                        primitiveType = new IndexMetadata.PrimitiveType(type, keyword, aggregatable && keyword.isPresent());
                    }
          '''
          new = '''                    if (type.equals("text")) {
                        Optional<String> keyword = keywordSubfield(value, useBoundedKeyword);
                        boolean keywordAggregatable = keyword
                                .map(name -> value.path("fields").path(name))
                                .map(ElasticsearchClient::hasDocValues)
                                .orElse(false);
                        primitiveType = new IndexMetadata.PrimitiveType(type, keyword, keywordAggregatable);
                    }
          '''
          if old not in text:
              raise SystemExit("text keyword block not found")
          text = text.replace(old, new, 1)

          old = '''            if (subfieldNode.has("doc_values") && !subfieldNode.get("doc_values").asBoolean()) {
                continue;
            }
          '''
          new = '''            // Exact term/prefix predicates use the inverted index and do not require doc values.
            // Keep an indexed keyword sub-field for exact predicates even when doc_values=false; the selected
            // sub-field is marked non-aggregatable separately so sort/aggregation/statistics remain disabled.
            boolean indexed = !subfieldNode.has("index") || subfieldNode.get("index").asBoolean();
            boolean docValues = hasDocValues(subfieldNode);
            if (!indexed && !docValues) {
                continue;
            }
          '''
          if old not in text:
              raise SystemExit("doc_values keyword block not found")
          text = text.replace(old, new, 1)

          marker = '''    private JsonNode nullSafeNode(JsonNode jsonNode, String name)
          '''
          helper = '''    @VisibleForTesting
    static boolean hasDocValues(JsonNode fieldNode)
    {
        return !fieldNode.has("doc_values") || fieldNode.get("doc_values").asBoolean();
    }

          '''
          if marker not in text:
              raise SystemExit("nullSafeNode marker not found")
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text)

          page_source = "plugin/trino-elasticsearch/src/main/java/io/trino/plugin/elasticsearch/AggregationQueryPageSource.java"
          p = Path(page_source)
          text = p.read_text()
          old = '''        else if (value.isNumber()) {
            type.writeBoolean(builder, value.asLong() != 0);
        }
          '''
          new = '''        else if (value.isNumber()) {
            double numeric = value.asDouble();
            if (numeric == 1.0) {
                type.writeBoolean(builder, true);
            }
            else if (numeric == 0.0) {
                type.writeBoolean(builder, false);
            }
            else {
                throw new TrinoException(TYPE_MISMATCH, format("Cannot parse value for field as BOOLEAN: %s", value));
            }
        }
          '''
          if old not in text:
              raise SystemExit("boolean numeric block not found")
          p.write_text(text.replace(old, new, 1))

          keyword_test = Path("plugin/trino-elasticsearch/src/test/java/io/trino/plugin/elasticsearch/client/TestKeywordSubfield.java")
          text = keyword_test.read_text()
          text = text.replace(
              'import static io.trino.plugin.elasticsearch.client.ElasticsearchClient.keywordSubfield;\n',
              'import static io.trino.plugin.elasticsearch.client.ElasticsearchClient.hasDocValues;\nimport static io.trino.plugin.elasticsearch.client.ElasticsearchClient.keywordSubfield;\n',
              1)
          start = text.index('    @Test\n    public void testNonAggregatableKeywordSubfieldIgnored()')
          end = text.index('    private static JsonNode field', start)
          replacement = '''    @Test
    public void testKeywordSubfieldWithoutDocValuesStillSupportsExactPredicates()
            throws IOException
    {
        JsonNode field = field(
                """
                { "type": "text", "fields": { "raw": { "type": "keyword", "doc_values": false } } }
                """);
        assertThat(keywordSubfield(field, false)).contains("raw");
        assertThat(keywordSubfield(field, true)).contains("raw");
        assertThat(hasDocValues(field.path("fields").path("raw"))).isFalse();
    }

    @Test
    public void testUnboundedExactPredicateSubfieldPreferredEvenWithoutDocValues()
            throws IOException
    {
        JsonNode field = field(
                """
                { "type": "text", "fields": {
                    "unbounded_no_doc_values": { "type": "keyword", "doc_values": false },
                    "bounded": { "type": "keyword", "ignore_above": 256 } } }
                """);
        assertThat(keywordSubfield(field, false)).contains("unbounded_no_doc_values");
        assertThat(keywordSubfield(field, true)).contains("unbounded_no_doc_values");
    }

    @Test
    public void testKeywordSubfieldWithoutIndexOrDocValuesIsIgnored()
            throws IOException
    {
        JsonNode field = field(
                """
                { "type": "text", "fields": { "raw": { "type": "keyword", "index": false, "doc_values": false } } }
                """);
        assertThat(keywordSubfield(field, false)).isEmpty();
        assertThat(keywordSubfield(field, true)).isEmpty();
    }

'''
          keyword_test.write_text(text[:start] + replacement + text[end:])

          boolean_test = Path("plugin/trino-elasticsearch/src/test/java/io/trino/plugin/elasticsearch/TestAggregationQueryPageSource.java")
          text = boolean_test.read_text()
          text = text.replace(
              'import com.fasterxml.jackson.databind.node.BooleanNode;\nimport com.fasterxml.jackson.databind.node.IntNode;\n',
              'import com.fasterxml.jackson.databind.node.BooleanNode;\nimport com.fasterxml.jackson.databind.node.DoubleNode;\nimport com.fasterxml.jackson.databind.node.IntNode;\n',
              1)
          old = '''        assertThat(decodeBoolean(new IntNode(1))).isTrue();
        assertThat(decodeBoolean(new IntNode(0))).isFalse();
        assertThat(decodeBoolean(new IntNode(5))).isTrue();
          '''
          new = '''        assertThat(decodeBoolean(new IntNode(1))).isTrue();
        assertThat(decodeBoolean(new IntNode(0))).isFalse();
        assertThat(decodeBoolean(new DoubleNode(1.0))).isTrue();
        assertThat(decodeBoolean(new DoubleNode(0.0))).isFalse();
        assertInvalidBoolean(new IntNode(5));
        assertInvalidBoolean(new IntNode(-1));
        assertInvalidBoolean(new DoubleNode(0.5));
          '''
          if old not in text:
              raise SystemExit("boolean test numeric block not found")
          text = text.replace(old, new, 1)
          marker = '''    private static boolean decodeBoolean(JsonNode jsonNode)
          '''
          helper = '''    private static void assertInvalidBoolean(JsonNode jsonNode)
    {
        assertThatThrownBy(() -> decodeBoolean(jsonNode))
                .isInstanceOf(TrinoException.class)
                .hasMessageContaining("Cannot parse value for field as BOOLEAN")
                .extracting(e -> ((TrinoException) e).getErrorCode())
                .isEqualTo(TYPE_MISMATCH.toErrorCode());
    }

          '''
          if marker not in text:
              raise SystemExit("decodeBoolean marker not found")
          boolean_test.write_text(text.replace(marker, helper + marker, 1))

          connector_test = Path("plugin/trino-elasticsearch/src/test/java/io/trino/plugin/elasticsearch/BaseElasticsearchConnectorTest.java")
          text = connector_test.read_text()
          marker = '''    @Test
    public void testLike()
          '''
          addition = '''    @Test
    public void testKeywordSubfieldWithoutDocValuesSupportsExactFilter()
            throws IOException
    {
        String indexName = "keyword_no_doc_values";
        @Language("JSON")
        String mapping =
                """
                {
                  "properties": {
                    "text_column": {
                      "type": "text",
                      "fields": {
                        "raw": { "type": "keyword", "doc_values": false }
                      }
                    }
                  }
                }
                """;
        createIndex(indexName, mapping);
        index(indexName, ImmutableMap.of("text_column", "exact"));
        index(indexName, ImmutableMap.of("text_column", "other"));

        assertThat(query("SELECT text_column FROM " + indexName + " WHERE text_column = 'exact'"))
                .matches("VALUES VARCHAR 'exact'")
                .isFullyPushedDown();
        assertThat(query("SELECT text_column FROM " + indexName + " ORDER BY text_column LIMIT 1"))
                .isNotFullyPushedDown(io.trino.sql.planner.plan.TopNNode.class);
    }

    @Test
    public void testFilteredAggregateIsNotPushedDown()
            throws IOException
    {
        String indexName = "filtered_aggregate_test";
        @Language("JSON")
        String mapping =
                """
                {
                  "properties": {
                    "enabled": { "type": "boolean" }
                  }
                }
                """;
        createIndex(indexName, mapping);
        index(indexName, ImmutableMap.of("enabled", true));
        index(indexName, ImmutableMap.of("enabled", false));

        assertThat(query("SELECT count(*) FILTER (WHERE enabled) FROM " + indexName))
                .matches("VALUES BIGINT '1'")
                .isNotFullyPushedDown(io.trino.sql.planner.plan.AggregationNode.class);
    }

          '''
          if marker not in text:
              raise SystemExit("testLike marker not found")
          connector_test.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Run focused Elasticsearch tests
        run: ./mvnw -pl plugin/trino-elasticsearch -am -Dtest=TestKeywordSubfield,TestAggregationQueryPageSource -Dsurefire.failIfNoSpecifiedTests=false -Dair.check.skip-all test
      - name: Publish verified follow-up commit
        shell: bash
        run: |
          rm -f .github/workflows/agent-es-pushdown-followup.yml \
                .github/workflows/agent-es-pushdown-pr.yml \
                .github/workflows/agent-es-pushdown-pr-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft 1a9e0147c0aa92626dbaf43ad32f7d5e8c087b60
          git commit -m "fix(elasticsearch): separate exact predicates from doc-value capabilities"
          git push --force origin HEAD:fix/es-pushdown-fixes
